
[project]
name = "gbemu"
version = "0.1.0"
description = "A gameboy emulator created with python"
authors = [{ name = "Wyatt Ferguson", email = "wyattxdev@duck.com" }]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["gameboy", "emulator", "gb", "DMG", "gbemu"]
requires-python = ">=3.11,<4"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.1.8",
    "pygame>=2.6.1; implementation_name != 'pypy'",
    "pygame-ce>=2.5.0; implementation_name == 'pypy'",
]

[dependency-groups]
dev = [
    "ty>=0.0.17",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "taskipy>=1.14.1",
    "cython>=3.2.4",
    "setuptools>=82.0.1",
]

[project.urls]
homepage = "https://github.com/wyattferguson/gbemu"
repository = "https://github.com/wyattferguson/gbemu.git"
documentation = "https://github.com/wyattferguson/gbemu"
issues = "https://github.com/wyattferguson/gbemu/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
gbemu = "gbemu.__main__:run"

[tool.uv]
python-preference = "only-managed"

[tool.taskipy.tasks]
format = {cmd = "ruff format ./src/gbemu/", help = "Format code using ruff"}
lint = {cmd = "ruff check --fix ./src/gbemu/", help = "Lint and auto-fix code using ruff"}
type = {cmd = "ty check", help = "Typecheck code using ty" }
tests = {cmd = "pytest --verbose -s --color=yes -m \"not performance\" tests", help = "Run tests using pytest"}
perf = {cmd = "pytest --verbose -s --color=yes -m performance tests", help = "Run performance tests."}
run = {cmd = "gbemu", help = "Run the emulator"}

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".cache",
]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102",    # Flake8-future-annotations
    "F401",     # Disable fix for unused imports
    "B904",     # Allow raising exceptions without from e
    "PLR0913",  # too many arguments
    "CPY",      # Flake8-copyright
    "T201",     # Debugging print statements
    "ERA",      # Eradicate – detects commented-out code
    "BLE001",   # Catch-all exceptions
    "D100",     # missing docstring in public module
    "D105",     # undocumented magic method
    "D107",     # undocumented public init
    "D203",     # incorrect-blank-line-before-class
    "D205",     # line-between-summary-and-description
    "D212",     # multi-line-summary-first-line
    "D400",     # missing-trailing-period
    "D407",     # missing-dashed-underline-after-section
    "S311",     # rand-usage
    "EM102",    # f-string-exception
    "EM101",    # implicit-str-concatenation
    "TRY003",   # long-exception-messages
    "FBT003",   # bool argument in function call
    "FBT002",   # bool argument in lambda
    "FBT001",   # bool argument in function definition
    "PLR2004",  # Magic values
    "FIX002",   # TODOs can hang out
    "TD002",    # missing todo authoer
    "TD003",    # missing todo link
    "TC001",    # move import into type-checking block
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLC0415",  # Import outside top-level (tests often need scoped imports)
    "PLR2004",  # Magic values
    "PT001",    # Use @pytest.fixture() over @pytest.fixture
    "S101",     # Use of assert detected
    "D101",     # Missing docstring in public class
    "D103",     # Missing docstring in public function
    "E741",     # Ambiguous variable name 'l', 'O', or 'I'
]

[tool.ty]
terminal.output-format = "full"

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
unsupported-operator = "ignore" # fix for MMU operations

[tool.ty.src]
include = ["src/gbemu/**/*.py"]

[tool.pytest.ini_options]
markers = [
    "performance: performance benchmark-style tests (opt-in)",
]
