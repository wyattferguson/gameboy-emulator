
[project]
name = "gbemu"
version = "0.1.0"
description = "A gameboy emulator created with python"
authors = [{ name = "Wyatt Ferguson", email = "wyattxdev@duck.com" }]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python"]
requires-python = ">=3.13,<4"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "ty>=0.0.17",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "taskipy>=1.14.1",
]

[project.urls]
homepage = "https://github.com/wyattferguson/gbemu"
repository = "https://github.com/wyattferguson/gbemu.git"
documentation = "https://github.com/wyattferguson/gbemu"
issues = "https://github.com/wyattferguson/gbemu/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

# [project.scripts]
# gbemu = "gbemu.__main__:run"

[tool.taskipy.tasks]
format = {cmd = "ruff format ./src/gbemu/", help = "Format code using ruff"}
lint = {cmd = "ruff check --fix ./src/gbemu/", help = "Lint and auto-fix code using ruff"}
type = {cmd = "ty check", help = "Typecheck code using ty" }
tests = {cmd = "pytest --verbose -s --color=yes tests", help = "Run tests using pytest"}
# run = "gbemu"
run = {cmd = "uv run ./src/gbemu/test.py", help = "Run the emulator"}

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".cache",
]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102", # Flake8-future-annotations
    "F401", # Disable fix for unused imports
    "B904", # Allow raising exceptions without from e
    "PLR0913", # too many arguments
    "CPY", # Flake8-copyright
    "T201", # Debugging print statements
    "ERA", # Eradicate – detects commented-out code
    "BLE001", # Catch-all exceptions
    "D100", # missing docstring in public module
    "D105", # undocumented magic method
    "D107", # undocumented public init
    "D203", # incorrect-blank-line-before-class
    "D205", # line-between-summary-and-description
    "D212", # multi-line-summary-first-line
    "D400", # missing-trailing-period
    "D407", # missing-dashed-underline-after-section
    "S311", # rand-usage
    "EM102", # f-string-exception
    "EM101", # implicit-str-concatenation
    "TRY003", # long-exception-messages
    "FBT003", # bool argument in function call
    "FBT002", # bool argument in lambda
    "FBT001", # bool argument in function definition
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLC0415",  # Import outside top-level (tests often need scoped imports)
    "PLR2004",  # Magic values (test assertions with status codes, etc.)
    "F841",     # Unused variable (fixtures, etc.)
    "PT001",    # Use @pytest.fixture() over @pytest.fixture
    "S101",    # Use of assert detected
    "D101",  # Missing docstring in public class
    "D103",  # Missing docstring in public function
    "E741", # Ambiguous variable name 'l', 'O', or 'I'
]

[tool.ty]
terminal.output-format = "full"

[tool.ty.src]
include = ["src/gbemu/**/*.py"]